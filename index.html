<script>
/* =========================
   DARK / LIGHT MODE GLOBAL
========================= */

const themeToggle = document.getElementById("theme-toggle");


// Cek tema yang sebelumnya dipilih
const savedTheme = localStorage.getItem("theme");


// Kalau sebelumnya dark mode
if (savedTheme === "dark") {
    document.body.classList.add("dark-mode");
}


// Update icon sesuai tema
function updateThemeIcon() {

    if (!themeToggle) return;

    const icon = themeToggle.querySelector("i");

    if (document.body.classList.contains("dark-mode")) {

        icon.classList.remove("fa-moon");
        icon.classList.add("fa-sun");

    } else {

        icon.classList.remove("fa-sun");
        icon.classList.add("fa-moon");

    }
}


// Jalankan saat halaman dibuka
updateThemeIcon();


// Tombol Dark / Light
if (themeToggle) {

    themeToggle.addEventListener("click", function () {

        document.body.classList.toggle("dark-mode");


        // Simpan pilihan
        if (document.body.classList.contains("dark-mode")) {

            localStorage.setItem("theme", "dark");

        } else {

            localStorage.setItem("theme", "light");

        }


        updateThemeIcon();

    });

}



/* =========================
   EXPLORE BUTTON
========================= */

const exploreButton =
    document.getElementById("explore-button");


if (exploreButton) {

    exploreButton.addEventListener("click", function () {

        const aboutSection =
            document.querySelector(".about-section");


        if (aboutSection) {

            aboutSection.scrollIntoView({
                behavior: "smooth"
            });

        }

    });

}



/* =========================
   SEARCH
========================= */

const searchInput =
    document.getElementById("search-input");

const searchButton =
    document.getElementById("search-button");


function performSearch() {

    if (!searchInput) return;


    const keyword =
        searchInput.value.trim().toLowerCase();


    if (keyword === "") {
        return;
    }


    if (keyword.includes("sixteenagers")) {

        window.location.href =
            "sixteenagers.html";

        return;
    }


    if (
        keyword.includes("kepala") ||
        keyword.includes("sekolah")
    ) {

        window.location.href =
            "kepala-sekolah.html";

        return;
    }


    if (
        keyword.includes("visi") ||
        keyword.includes("misi")
    ) {

        window.location.href =
            "visi-misi.html";

        return;
    }


    alert(
        "Halaman untuk '" +
        searchInput.value +
        "' belum tersedia."
    );

}


if (searchButton) {

    searchButton.addEventListener(
        "click",
        performSearch
    );

}


if (searchInput) {

    searchInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                performSearch();

            }

        }
    );

}



/* =========================
   PARALLAX SIXTEENAGERS
========================= */

const sixteenPage =
    document.querySelector(".sixteen-page");


if (sixteenPage) {

    document.addEventListener(
        "mousemove",
        function (event) {

            const x =
                (window.innerWidth / 2 - event.clientX) / 50;

            const y =
                (window.innerHeight / 2 - event.clientY) / 50;


            sixteenPage.style.setProperty(
                "--mouse-x",
                x + "px"
            );


            sixteenPage.style.setProperty(
                "--mouse-y",
                y + "px"
            );

        }
    );

}
</script>
